name: vinted-deal-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      skip_scoring:
        description: "Test mode: skip LLM scoring, fake-pass every new listing to check search/dedup/ntfy"
        type: boolean
        default: false

concurrency:
  group: vinted-deal-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run bot
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: ${{ vars.AI_GATEWAY_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SKIP_SCORING: ${{ inputs.skip_scoring }}
        run: python scripts/vinted_bot.py

      - name: Commit updated state
        run: |
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add data/seen_listings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update dedup state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi
