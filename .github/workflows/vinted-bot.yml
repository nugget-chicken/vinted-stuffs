name: vinted-deal-bot
 
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      skip_scoring:
        description: "Test mode: skip Gemini, fake-pass every new listing to check search/dedup/ntfy"
        type: boolean
        default: false
 
concurrency:
  group: vinted-deal-bot
  cancel-in-progress: false
 
permissions:
  contents: write
 
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
 
      - name: Run bot
        env:
          SCRAPEBADGER_API_KEY: ${{ secrets.SCRAPEBADGER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SKIP_SCORING: ${{ inputs.skip_scoring }}
        run: python scripts/vinted_bot.py
 
      - name: Commit updated state
        run: |
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add data/seen_listings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update dedup state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi
 
