name: Vinted Deal Watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (5 min is the fastest GitHub allows)
  workflow_dispatch:          # adds a "Run workflow" button for manual testing

permissions:
  contents: write             # lets this workflow save seen_ids.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        run: python vinted_bot.py

      - name: Save any newly-seen listings
        run: |
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "Update seen listings"
          git push
